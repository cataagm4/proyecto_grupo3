<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta http-equiv="Content-Style-Type" content="text/css">
  <title>Proyecto Grupo 3</title>
  <meta name="Generator" content="Cocoa HTML Writer">
  <meta name="CocoaVersion" content="2685.3">
  <style type="text/css">
    p.p2 {margin: 0.0px 0.0px 12.0px 0.0px; font: 12.0px Times; -webkit-text-stroke: #000000}
    p.p3 {margin: 0.0px 0.0px 12.0px 0.0px; font: 12.0px Times; -webkit-text-stroke: #000000; min-height: 14.0px}
    span.s1 {font-kerning: none}

    .dark-theme {
      background-color: #1a1a1a !important;
      color: white !important;
    }

    .dark-theme p, .dark-theme h1, .dark-theme span {
      color: white !important;
      -webkit-text-stroke: 0px !important; 
    }


    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animacion-entrada {
      animation: fadeInUp 1s ease-out forwards;
    }


    .retraso-1 { animation-delay: 0.3s; }
    .retraso-2 { animation-delay: 0.6s; }

  </style>
</head>
<body>
  <h1 class="animacion-entrada" style="margin: 0.0px 0.0px 16.1px 0.0px; font: 24.0px Times; -webkit-text-stroke: #000000">
    <span class="s1"><b>Bienvenidos al Proyecto de Grupo</b></span>
  </h1>

  <p class="p2 animacion-entrada retraso-1">
    <span class="s1">Esta es una página de ejemplo para el laboratorio de Git.</span>
  </p>

  <p class="p2 animacion-entrada retraso-2">
    <span class="s1">Colaborador: Catalina Gómez</span>
  </p> 

  <p class="p2 animacion-entrada retraso-3">
    <span class="s1">Colaborador: Samuel Rodríguez</span>
  </p> 

  <button id="dark-mode-toggle" class="animacion-entrada retraso-2" style="padding: 10px; cursor: pointer;">
    Cambiar Modo
  </button>

  <script>
    const btn = document.getElementById('dark-mode-toggle');
    btn.addEventListener('click', () => {
      document.body.classList.toggle('dark-theme');
      if (document.body.classList.contains('dark-theme')) {
        btn.textContent = "Modo Claro";
      } else {
        btn.textContent = "Modo Oscuro";
      }
    });
  </script>
</body>
</html>
